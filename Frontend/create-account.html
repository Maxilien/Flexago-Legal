<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account – Flexago Traveler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .create-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .success {
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="create-container">

  <h1>Create Your Traveler Account</h1>
  <p>Your identity has been verified. Complete your account setup below.</p>

  <div id="statusArea"></div>

  <input id="firstName" type="text" placeholder="First Name" />
  <input id="lastName" type="text" placeholder="Last Name" />
  <input id="email" type="email" placeholder="Email" />
  <input id="phone" type="text" placeholder="Phone Number" />

  <button id="createBtn" class="primary-btn">
    Create Account
  </button>

</div>

<script>
  document.getElementById("createBtn").onclick = async () => {
    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!firstName || !lastName || !email || !phone) {
      document.getElementById("statusArea").innerHTML =
        "<p>Please fill out all fields.</p>";
      return;
    }

    const res = await fetch("https://flexago-backend.onrender.com/api/auth/create-traveler", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        firstName,
        lastName,
        email,
        phone,
        role: "traveler",
        kycVerified: true
      })
    });

    const data = await res.json();

    if (data.success) {
      document.getElementById("statusArea").innerHTML =
        '<p class="success">🎉 Account Created Successfully!</p>';

      // Save user to localStorage
      localStorage.setItem("flexagoUser", JSON.stringify(data.user));

      // Redirect to Traveler Dashboard
      setTimeout(() => {
        window.location.href = "/Traveler.html";
      }, 1500);

    } else {
      document.getElementById("statusArea").innerHTML =
        `<p>${data.message || "Unable to create account."}</p>`;
    }
  };
</script>

</body>
</html>
