<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Account – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .create-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    #statusArea {
      text-align: center;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #dc2626;
    }
  </style>
</head>

<body>

<div class="create-container">

  <h1>Create Your Flexago Account</h1>
  <p>Complete your account setup below.</p>

  <div id="statusArea"></div>

  <form id="createAccountForm">

    <input id="firstName" type="text" placeholder="First Name" />
    <input id="lastName" type="text" placeholder="Last Name" />
    <input id="email" type="email" placeholder="Email" />
    <input id="phone" type="text" placeholder="Phone Number" />

    <!-- ⭐ NEW: Password + Confirm Password -->
    <input id="password" type="password" placeholder="Password (min 6 chars)" />
    <input id="confirmPassword" type="password" placeholder="Confirm Password" />

    <select id="role">
      <option value="" disabled selected>Select Role</option>
      <option value="traveler">Traveler</option>
      <option value="sender">Sender</option>
    </select>

    <button id="createBtn" class="primary-btn" type="submit">
      Create Account
    </button>

  </form>

</div>

<script src="create-account.js"></script>

</body>
</html>
