<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Identity Verification – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .verify-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .success {
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="verify-container">

  <h1>Identity Verification</h1>

  <p class="success">🎉 Identity Verified</p>

  <button id="nextBtn" class="secondary-btn">
    Next: Create Account
  </button>

</div>

<script>
  document.getElementById("nextBtn").onclick = () => {
    window.location.href = "/create-account.html";
  };
</script>

</body>
</html>
