<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Identity – Flexago Traveler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .verify-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      background: #e5e7eb;
      color: #374151;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .success {
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="verify-container" id="verifyBox">

  <h1>Verify Your Identity</h1>
  <p>Travelers must verify their identity before creating a payout account.</p>

  <div id="statusArea">
    <!-- Status will be injected here -->
  </div>

  <button id="startBtn" class="primary-btn">
    Start Identity Verification
  </button>

  <button id="nextBtn" class="secondary-btn" style="display:none;">
    Next: Create Account
  </button>

</div>

<script>
  // Load user
  const user = JSON.parse(localStorage.getItem("flexagoUser"));
  if (!user) window.location.href = "/signup.html";

  // Only travelers should be here
  if (user.role !== "traveler") {
    window.location.href = "/Sender.html";
  }

  /* ============================================================
     1. CHECK VERIFICATION STATUS
     ============================================================ */
  async function checkStatus() {
    const res = await fetch(
      `https://flexago-backend.onrender.com/api/verify/status?userId=${user._id}`
    );

    const data = await res.json();

    const statusArea = document.getElementById("statusArea");
    const startBtn = document.getElementById("startBtn");
    const nextBtn = document.getElementById("nextBtn");

    if (data.verified) {
      statusArea.innerHTML = `
        <p class="success">🎉 Identity Verified</p>
      `;
      startBtn.style.display = "none";
      nextBtn.style.display = "block";
    } else {
      statusArea.innerHTML = `
        <p>Your identity has not been verified yet.</p>
      `;
      startBtn.style.display = "block";
      nextBtn.style.display = "none";
    }
  }

  checkStatus();

  /* ============================================================
     2. START IDENTITY VERIFICATION
     ============================================================ */
  document.getElementById("startBtn").onclick = async () => {
    const res = await fetch("https://flexago-backend.onrender.com/api/verify/create-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: user._id })
    });

    const data = await res.json();

    if (!data.success || !data.url) {
      alert("Unable to start identity verification. Try again.");
      return;
    }

    // Redirect to Stripe Identity
    window.location.href = data.url;
  };

  /* ============================================================
     3. NEXT STEP AFTER VERIFICATION
     ============================================================ */
  document.getElementById("nextBtn").onclick = () => {
    window.location.href = "/create-account.html";
  };
</script>

</body>
</html>
