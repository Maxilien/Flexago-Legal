<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Identity – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .verify-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .secondary-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }

    .success {
      color: #16a34a;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="verify-container">

  <h1>Identity Verification</h1>
  <p>We are checking your verification status.</p>

  <div id="statusArea"></div>

  <button id="nextBtn" class="secondary-btn">
    Next: Create Account
  </button>

</div>

<script>
  /* ============================================================
     1. GET STRIPE SESSION ID FROM URL
     ============================================================ */
  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get("session_id");

  if (!sessionId) {
    document.getElementById("statusArea").innerHTML = `
      <p>Verification session not found. Please restart identity verification.</p>
    `;
  } else {
    checkVerificationStatus(sessionId);
  }

  /* ============================================================
     2. CHECK VERIFICATION STATUS FROM STRIPE
     ============================================================ */
  async function checkVerificationStatus(sessionId) {
    const res = await fetch(
      `https://flexago-backend.onrender.com/api/verify/check-session?sessionId=${sessionId}`
    );

    const data = await res.json();
    const statusArea = document.getElementById("statusArea");
    const nextBtn = document.getElementById("nextBtn");

    if (data.verified) {
      statusArea.innerHTML = `
        <p class="success">🎉 Identity Verified</p>
      `;
      nextBtn.style.display = "block";
    } else {
      statusArea.innerHTML = `
        <p>Your identity has not been verified yet.</p>
      `;
    }
  }

  /* ============================================================
     3. NEXT STEP → CREATE ACCOUNT
     ============================================================ */
  document.getElementById("nextBtn").onclick = () => {
    window.location.href = "/create-account.html";
  };
</script>

</body>
</html>
