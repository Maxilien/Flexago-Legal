<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Identity – Flexago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/auth.css" />

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 0;
    }

    .verify-container {
      max-width: 480px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.6rem;
      font-weight: 600;
    }

    p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
    }

    .next-btn {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

<div class="verify-container">

  <h1>Verify Your Identity</h1>
  <p>Click below to begin secure identity verification.</p>

  <button id="startVerificationBtn" class="primary-btn">
    Start Identity Verification
  </button>

  <button id="continueBtn" class="next-btn">
    Continue
  </button>

</div>

<script>
  const user = JSON.parse(localStorage.getItem("flexagoUser"));
  if (!user) window.location.href = "/signup.html";

  // Detect if Stripe redirected back to this page
  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get("session_id");

  if (sessionId) {
    // Stripe has redirected back — show Continue button
    document.getElementById("continueBtn").style.display = "block";
  }

  // Start verification
  document.getElementById("startVerificationBtn").onclick = async () => {
    const res = await fetch("https://flexago-backend.onrender.com/api/identity/create-session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: user._id })
    });

    const data = await res.json();

    if (!data.success || !data.url) {
      alert("Unable to start identity verification.");
      return;
    }

    // Redirect to Stripe hosted verification
    window.location.href = data.url;
  };

  // Continue after verification
  document.getElementById("continueBtn").onclick = () => {
    // Sender goes to Sender.html
    if (user.role === "sender") {
      window.location.href = "/Sender.html";
    }

    // Traveler goes to payout onboarding
    if (user.role === "traveler") {
      window.location.href = "/verify-stripe.html";
    }
  };
</script>

</body>
</html>
